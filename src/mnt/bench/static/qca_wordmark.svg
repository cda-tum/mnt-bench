  <title id="wordmark-title">MNT Bench QCA wordmark</title>
  <desc id="wordmark-description">MNT above BENCH, formed from decorative quantum-dot cellular automata cells. Each cell has four corner dots with two filled on opposite corners. This wordmark is not a functional circuit.</desc>
