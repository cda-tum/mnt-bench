name: Deploy to PyPI

on:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify_release_asset:
    if: github.event_name == 'release' && github.event.action == 'published'
    name: Verify benchmark archive
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the benchmark archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          asset_count="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '[.assets[] | select(.name == "MNTBench_all.zip")] | length')"
          if [[ "${asset_count}" != "1" ]]; then
            echo "::error::Attach exactly one MNTBench_all.zip asset to the GitHub release before publishing to PyPI."
            exit 1
          fi

  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run pre-commit
        run: pipx run pre-commit run --all-files --show-diff-on-failure

  build_wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
        name: Install Python
      - name: Build wheel
        run: pipx run build --wheel
      - name: Check wheel
        run: pipx run twine check dist/*.whl
      - name: Install and test wheel
        run: |
          python -m pip install --verbose pytest dist/*.whl
          python -m pytest
          python -m pip check
          mnt-bench --help
          mnt.bench --help
      - if: github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-wheel
          path: dist/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
        name: Install Python
      - name: Build sdist
        run: pipx run build --sdist
      - name: Check source distribution
        run: pipx run twine check dist/*.tar.gz
      - name: Install and test source distribution
        run: |
          python -m pip install --verbose pytest dist/*.tar.gz
          python -m pytest
          python -m pip check
          mnt-bench --help
          mnt.bench --help
      - if: github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  upload_pypi:
    if: github.event_name == 'release' && github.event.action == 'published'
    name: 🚀 Deploy to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mnt.bench
    permissions:
      id-token: write
    needs: [verify_release_asset, quality, build_wheel, build_sdist]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifact-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
  upload_webserver:
    name: Update hosted version
    needs: upload_pypi
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: read
    env:
      CDA_HOST_NAME: tueicda-cda.srv.mwn.de
      CDA_TARGET_DIR: /var/www/cda/app/mntbench/
      CDA_USER_NAME: web-user
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create version file
        run: |
          echo "version = \"$(git describe --tags --always)\"" > mntbench_version.txt
      - name: Setup SSH via the stored Action Secrets
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "${KNOWN_HOSTS}" >> ~/.ssh/known_hosts
          echo "${DEPLOY_KEY}" > ~/.ssh/my_rsync_key
          echo "IdentityFile ~/.ssh/my_rsync_key" >> ~/.ssh/config
          chmod -R 700 ~/.ssh
      - name: Copy version file to the webserver
        working-directory: ${{ github.workspace }}
        run: |
          rsync -avz -e ssh mntbench_version.txt ${CDA_USER_NAME}@${CDA_HOST_NAME}:${CDA_TARGET_DIR}/mntbench_version.txt
