name: MyPy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # TODO(emudhra): remove incident-specific setup only after runner/client verification; see #39.
  # Use the refreshed OS roots instead of Node's bundled certificate snapshot.
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_PYTHON_DOWNLOADS: never
  # Authenticate the bootstrap even if the preinstalled pip still trusts compromised CAs.
  PIP_BOOTSTRAP_URL: https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Type check
    permissions:
      contents: read
    steps:
      - name: Refresh system certificates
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade --yes ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Bootstrap patched pip
        run: python -m pip install --upgrade "pip @ $PIP_BOOTSTRAP_URL"
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: auto
          cache-suffix: ${{ github.job }}
      - name: Install type-checking dependencies
        run: uv pip install --python "$(command -v python)" ".[test]" mypy types-requests types-tqdm
      - name: Run MyPy
        run: python -m mypy
